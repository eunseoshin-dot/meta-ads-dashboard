<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta 광고 대시보드</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 30px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header h1 { font-size: 32px; color: #667eea; margin-bottom: 20px; }
        .info-row { display: flex; gap: 40px; flex-wrap: wrap; margin-bottom: 20px; }
        .info-item { display: flex; flex-direction: column; gap: 5px; }
        .info-label { font-size: 12px; color: #999; text-transform: uppercase; }
        .info-value { font-size: 18px; font-weight: 600; color: #333; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 25px; cursor: pointer; font-weight: 600; }
        .filter-btn.active { background: #667eea; color: white; }
        .campaigns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .campaign-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-left: 5px solid #ddd; }
        .campaign-card.active { border-left-color: #27ae60; background: linear-gradient(135deg, #f9fff9 0%, #ffffff 100%); }
        .campaign-card.inactive { border-left-color: #e74c3c; background: linear-gradient(135deg, #fff9f9 0%, #ffffff 100%); }
        .campaign-header { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
        .campaign-name { font-size: 18px; font-weight: 700; flex: 1; }
        .campaign-status { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .campaign-status.on { background: #e6f7e6; color: #27ae60; }
        .campaign-status.off { background: #ffe6e6; color: #e74c3c; }
        .campaign-details { display: grid; gap: 12px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .detail-item { display: flex; justify-content: space-between; }
        .detail-label { font-size: 13px; color: #999; }
        .detail-value { font-size: 16px; font-weight: 600; }
        .toggle-btn { width: 100%; padding: 12px; border: 2px solid #ddd; background: white; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .toggle-btn.on { border-color: #27ae60; color: #27ae60; background: #f0fff0; }
        .toggle-btn.off { border-color: #e74c3c; color: #e74c3c; background: #fff0f0; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .stat-label { font-size: 12px; opacity: 0.9; }
        .refresh-info { text-align: center; color: #999; font-size: 12px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .refresh-time { font-weight: 600; color: #667eea; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Meta 광고 대시보드</h1>
            <div class="info-row">
                <div class="info-item">
                    <span class="info-label">마지막 갱신</span>
                    <span class="info-value" id="lastUpdate">방금 전</span>
                </div>
                <div class="info-item">
                    <span class="info-label">현재 시각</span>
                    <span class="info-value" id="currentTime">--:--:--</span>
                </div>
            </div>
            <div class="controls">
                <button class="filter-btn active" onclick="filterCampaigns('all')">모두</button>
                <button class="filter-btn" onclick="filterCampaigns('on')">● 활성 중</button>
                <button class="filter-btn" onclick="filterCampaigns('off')">● 일시중지</button>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalCampaigns">0</div>
                    <div class="stat-label">전체 캠페인</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="activeCampaigns">0</div>
                    <div class="stat-label">활성 중</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="inactiveCampaigns">0</div>
                    <div class="stat-label">일시중지</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalSpend">$0</div>
                    <div class="stat-label">총 지출</div>
                </div>
            </div>
            <div class="refresh-info">
                <span>자동 갱신 중 • 다음 갱신: <span class="refresh-time" id="refreshCountdown">5분</span></span>
            </div>
        </div>
        <div class="campaigns-grid" id="campaignsList"></div>
    </div>

    <script>
        const VERCEL_API_URL = 'https://meta-ads-dashboard-backend.vercel.app/api/meta';
        const USE_META_API = true;

        let campaigns = [
            { id: 1, name: 'V_Summer_Video_Campaign', status: 'ON', spend: 1234, impressions: 45230, clicks: 1203, ctr: 2.66 },
            { id: 2, name: 'V_Display_Ads_Korean', status: 'OFF', spend: 567, impressions: 12450, clicks: 89, ctr: 0.71 },
            { id: 3, name: 'V_Retargeting_Website', status: 'ON', spend: 890, impressions: 23100, clicks: 456, ctr: 1.97 },
            { id: 4, name: 'V_Shopping_Dynamic_Feed', status: 'ON', spend: 2100, impressions: 67800, clicks: 2341, ctr: 3.45 },
        ];

        async function fetchMetaData() {
            try {
                const response = await fetch(`${VERCEL_API_URL}`);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                if (data.campaigns && data.campaigns.length > 0) {
                    campaigns = data.campaigns.map(ad => ({
                        id: ad.id,
                        name: ad.name || '캠페인',
                        status: ad.status === 'ACTIVE' ? 'ON' : 'OFF',
                        spend: Math.round(ad.spend || 0),
                        impressions: ad.impressions || 0,
                        clicks: ad.clicks || 0,
                        ctr: ad.ctr || 0
                    }));
                    console.log('✅ Meta API 데이터 로드:', campaigns.length, '개 캠페인');
                }
            } catch (error) {
                console.error('❌ API 오류:', error);
            }
        }

        function matchesCampaignFilter(name) {
            return name.includes('V_') && !name.includes('E_');
        }

        let currentFilter = 'all';

        function init() {
            if (USE_META_API) fetchMetaData();
            updateClock();
            renderCampaigns();
            updateStats();
            setInterval(updateClock, 1000);
            setInterval(async () => {
                if (USE_META_API) await fetchMetaData();
                renderCampaigns();
                updateStats();
            }, 5 * 60 * 1000);
            setInterval(updateCountdown, 1000);
            updateCountdown();
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${h}:${m}:${s}`;
        }

        function renderCampaigns() {
            const list = document.getElementById('campaignsList');
            const filtered = campaigns.filter(c => {
                if (!matchesCampaignFilter(c.name)) return false;
                if (currentFilter === 'on') return c.status === 'ON';
                if (currentFilter === 'off') return c.status === 'OFF';
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">📭 캠페인이 없습니다</div>';
                return;
            }

            list.innerHTML = filtered.map(c => `
                <div class="campaign-card ${c.status === 'ON' ? 'active' : 'inactive'}">
                    <div class="campaign-header">
                        <span class="campaign-name">${c.name}</span>
                        <span class="campaign-status ${c.status === 'ON' ? 'on' : 'off'}">● ${c.status === 'ON' ? '활성' : '중지'}</span>
                    </div>
                    <div class="campaign-details">
                        <div class="detail-item"><span class="detail-label">지출</span><span class="detail-value">$${c.spend.toLocaleString()}</span></div>
                        <div class="detail-item"><span class="detail-label">노출</span><span class="detail-value">${c.impressions.toLocaleString()}</span></div>
                        <div class="detail-item"><span class="detail-label">클릭</span><span class="detail-value">${c.clicks.toLocaleString()}</span></div>
                        <div class="detail-item"><span class="detail-label">CTR</span><span class="detail-value">${c.ctr.toFixed(2)}%</span></div>
                    </div>
                    <button class="toggle-btn ${c.status === 'ON' ? 'on' : 'off'}" onclick="toggleCampaign(${c.id})">
                        ${c.status === 'ON' ? '중지' : '활성화'}
                    </button>
                </div>
            `).join('');
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ko-KR');
        }

        function updateStats() {
            const filtered = campaigns.filter(c => matchesCampaignFilter(c.name));
            document.getElementById('totalCampaigns').textContent = filtered.length;
            document.getElementById('activeCampaigns').textContent = filtered.filter(c => c.status === 'ON').length;
            document.getElementById('inactiveCampaigns').textContent = filtered.filter(c => c.status === 'OFF').length;
            document.getElementById('totalSpend').textContent = `$${filtered.reduce((s, c) => s + c.spend, 0).toLocaleString()}`;
        }

        function toggleCampaign(id) {
            const c = campaigns.find(x => x.id === id);
            if (c) {
                c.status = c.status === 'ON' ? 'OFF' : 'ON';
                renderCampaigns();
                updateStats();
            }
        }

        function filterCampaigns(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderCampaigns();
        }

        function updateCountdown() {
            const now = Date.now();
            const next = Math.ceil(now / (5 * 60 * 1000)) * (5 * 60 * 1000);
            const sec = Math.max(0, Math.ceil((next - now) / 1000));
            const min = Math.floor(sec / 60);
            document.getElementById('refreshCountdown').textContent = `${min}분 ${sec % 60}초`;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
